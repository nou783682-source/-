            coinList.add(new RectF(1120, 290, 1160, 330));
        }

        @Override
        protected void onDraw(Canvas c) {
            super.onDraw(c);
            update();

            int w = getWidth();
            int h = getHeight();
            float cam = Math.max(0, x - 250);
            c.save();
            c.translate(-cam, 0);

            p.setColor(Color.rgb(90, 210, 90));
            for (RectF b : blocks) c.drawRect(b, p);

            p.setColor(Color.YELLOW);
            for (RectF coin : coinList) c.drawOval(coin, p);

            p.setColor(Color.RED);
            c.drawRect(enemy, p);

            p.setColor(Color.MAGENTA);
            c.drawRect(finish, p);

            p.setColor(Color.rgb(30, 40, 220));
            c.drawRoundRect(new RectF(x, y, x + 55, y + 70), 12, 12, p);

            c.restore();

            p.setColor(Color.BLACK);
            p.setTextSize(42);
            c.drawText("Sobr Jumper", 30, 55, p);
            c.drawText("Coins: " + coins + "  Lives: " + lives, 30, 105, p);

            p.setAlpha(90);
            p.setColor(Color.GRAY);
            c.drawCircle(90, h - 90, 65, p);
            c.drawCircle(230, h - 90, 65, p);
            c.drawCircle(w - 110, h - 90, 70, p);
            p.setAlpha(255);
            p.setColor(Color.WHITE);
            p.setTextSize(36);
            c.drawText("<", 78, h - 78, p);
            c.drawText(">", 218, h - 78, p);
            c.drawText("JUMP", w - 155, h - 78, p);

            if (win) {
                p.setColor(Color.rgb(0, 120, 0));
                p.setTextSize(70);
                c.drawText("LEVEL COMPLETE!", w / 2f - 300, h / 2f, p);
            }

            postInvalidateDelayed(16);
        }

