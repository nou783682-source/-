        int coins = 0, lives = 3;
        ArrayList<RectF> blocks = new ArrayList<>();
        ArrayList<RectF> coinList = new ArrayList<>();
        RectF enemy = new RectF(750, 360, 810, 420);
        float enemyDir = -1;
        RectF finish = new RectF(1500, 280, 1560, 420);
        boolean win = false;

        public GameView(Activity a) {
            super(a);
            setBackgroundColor(Color.rgb(110, 190, 255));
            blocks.add(new RectF(0, 430, 1800, 520));
            blocks.add(new RectF(350, 330, 550, 360));
            blocks.add(new RectF(700, 270, 900, 300));
